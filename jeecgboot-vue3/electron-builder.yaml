appId: 'com.jeecg.boot3'
# Tên sản phẩm
productName: 'jeecgboot'
files:
  # Chỉ bao gồm toàn bộ tệp trong thư mục dist
  - 'dist/**/*'
  # Đặc biệt loại trừ thư mục node_modules
  - '!node_modules'
directories:
  # Thư mục đầu ra
  output: 'dist-electron'
win:
  # Biểu tượng chương trình win exe
  icon: 'electron/icons/app.ico'
  artifactName: 'jeecgboot-setup-${version}.exe'
# Cấu hình gói cài đặt
nsis:
  oneClick: false
  # Có cho phép người dùng chọn thư mục cài đặt không
  allowToChangeInstallationDirectory: true
  # Có tạo shortcut trên desktop không
  createDesktopShortcut: true
  # Biểu tượng của trình cài đặt
  installerIcon: 'electron/icons/installer.ico'
