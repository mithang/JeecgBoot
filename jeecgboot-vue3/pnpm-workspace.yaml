# pnpm 11+ không còn đọc các thiết lập này từ .npmrc, cần đặt tại đây
shamefullyHoist: true
strictPeerDependencies: false

# pnpm 10+ mặc định cấm script build của dependency, ở đây cho phép tường minh
allowBuilds:
  '@logicflow/core': true
  '@scarf/scarf': false
  core-js: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@jeecg/aiflow@3.9.6-beta'
