    # Danh sách trắng: đã viết là cho qua, không liên quan đến công tắc (metadata đám mây,0.0.0.0 Ngoại trừ); hỗ trợ IP, dải mạng CIDR, tên miền, địa chỉ:Cổng (khuyến nghị, chỉ cho qua cổng đó, ví dụ cổng gateway vi dịch vụ localhost:9999); địa chỉ mạng công cộng không cần cấu hình
