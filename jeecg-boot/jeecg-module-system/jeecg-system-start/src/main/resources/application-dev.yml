server:
  port: 8080
  tomcat:
    max-swallow-size: -1
  servlet:
    context-path: /jeecg-boot
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges,jeecghttptrace

spring:
  flyway:
    # Có bật không flyway
    enabled: true
    # Đường dẫn lưu trữ script SQL di trú
    locations: classpath:flyway/sql/mysql
    # Có tắt chức năng xóa các bảng trong cơ sở dữ liệu hiện có hay không,Môi trường production bắt buộc phải là true,Nếu không sẽ xóa cơ sở dữ liệu, vô cùng quan trọng!!!
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # Tác vụ định kỳ gửi email
    timeJobSend: false
    host: smtp.163.com
    username: jeecgos@163.com
    password: ??
    properties:
      mail.smtp.timeout: 10000  # Thời gian chờ kết nối (mili giây)
      mail.smtp.connectiontimeout: 10000  # Thời gian chờ kết nối (mili giây)
      mail.smtp.writetimeout: 10000  # Thời gian chờ ghi (mili giây)
      mail.smtp.auth: true
      smtp.ssl.enable: true
#      mail.debug: true  # Bật chế độ gỡ lỗi(Xem nhật ký chi tiết)
  ## quartz Tác vụ định kỳ,Sử dụng phương thức cơ sở dữ liệu
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: embedded
    #Công tắc khởi động tác vụ định kỳ,true-Bật  false-Tắt
    auto-startup: true
    #Trì hoãn 1 giây rồi khởi động tác vụ định kỳ
    startup-delay: 1s
    #Cập nhật Job đã tồn tại khi khởi động Job
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            misfireThreshold: 12000
            clusterCheckinInterval: 15000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
  #json Chuyển đổi thống nhất dấu thời gian
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  #Cấu hình freemarker
  freemarker:
    # Đặt hậu tố tên mẫu
    suffix: .ftl
    # Đặt loại tài liệu
    content-type: text/html
    # Đặt định dạng mã hóa trang
    charset: UTF-8
    # Đặt bộ nhớ đệm trang
    cache: false
    prefer-file-system-access: false
    # Đặt đường dẫn tệp ftl
    template-loader-path:
      - classpath:/templates
    template_update_delay: 0
  # Đặt đường dẫn tệp tĩnh,js,css v.v.
  mvc:
    static-path-pattern: /**
    #Spring Boot 2.6+Chiến lược mặc định của việc khớp mapping sau đã đổi từ AntPathMatcher sang PathPatternParser,Cần chỉ định thủ công thành ant-path-matcher
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        # Mật khẩu yếu mặc định, nhất định phải đổi trước khi triển khai
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      druid:
        # Thông tin cấu hình connection pool
        # Kích thước khởi tạo, nhỏ nhất, lớn nhất
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        # Cấu hình thời gian chờ lấy kết nối
        maxWait: 60000
        # Cấu hình khoảng thời gian kiểm tra một lần để phát hiện các kết nối nhàn rỗi cần đóng, đơn vị là mili giây
        timeBetweenEvictionRunsMillis: 60000
        # Cấu hình thời gian tồn tại tối thiểu của một kết nối trong pool, đơn vị là mili giây
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # Bật PSCache và chỉ định kích thước PSCache trên mỗi kết nối
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # Cấu hình filters chặn thống kê giám sát, sau khi bỏ thì SQL trên giao diện giám sát không thể thống kê,'wall'Dùng cho tường lửa
        filters: stat,slf4j
        # Cho phép mệnh đề WHERE của câu lệnh SELECT là một điều kiện luôn đúng
        wall:
          selectWhereAlwayTrueCheck: false
        # Bật chức năng mergeSql; ghi lại SQL chậm
        stat:
          merge-sql: false
          slow-sql-millis: 5000
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/jeecg-boot?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
#        # shardingjdbc Nguồn dữ liệu
#        sharding-db:
#          driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
#          url: jdbc:shardingsphere:classpath:sharding.yaml
  #redis Cấu hình
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password:
#mybatis plus Cài đặt
mybatis-plus:
  mapper-locations: classpath*:org/jeecg/**/xml/*Mapper.xml
  global-config:
    # Đóng MP3.0 tích hợp sẵn banner
    banner: false
    db-config:
      #Loại khóa chính  0:"ID cơ sở dữ liệu tự tăng",1:"Loại này là chưa đặt loại khóa chính", 2:"Người dùng nhập ID",3:"Duy nhất toàn cục ID (Duy nhất kiểu số ID)", 4:"Duy nhất toàn cục ID UUID",5:"Duy nhất toàn cục kiểu chuỗi ID (idWorker Biểu diễn dạng chuỗi của)";
      id-type: ASSIGN_ID
      # Mặc định tên bảng cơ sở dữ liệu dùng dấu gạch dưới
      table-underline: true
  configuration:
    # Cấu hình này sẽ in SQL đã thực thi ra, có thể dùng khi phát triển hoặc kiểm thử
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # Kiểu trả về là Map,Hiển thị trường tương ứng với null
    call-setters-on-nulls: true
#jeecg Cấu hình chuyên dụng
minidao:
  base-package: org.jeecg.modules.jmreport.*,org.jeecg.modules.drag.*,org.jeecg.modules.chat2bi.*
jeecg:
  # Tiền tố yêu cầu tài nguyên tùy chỉnh (js, css v.v. để giải quyết vấn đề chuyển tiếp nginx)
  custom-resource-prefix-path:
  # AI Tích hợp
  ai-chat:
    enabled: true
    model: deepseek-v4-flash
    apiKey: ??
    apiHost: https://api.deepseek.com/v1
    timeout: 60
    skills-dir:
    skills-shell-dir:
    # AI Cấu hình giới hạn truy cập của trợ lý trò chuyện
    # Khi một mục để trống hoặc nhỏ hơn hoặc bằng 0 thì không giới hạn tần suất truy cập tương ứng
    rate-limit:
      # Giới hạn mỗi phút cho một session
      send-per-session-per-minute: 10
      # Giới hạn mỗi phút cho một IP
      send-per-ip-per-minute: 20
      # Giới hạn mỗi giờ cho một session
      upload-per-session-per-hour: 20
    # AI Vẽ tranh từ văn bản
    ai-model-draw:
      # Nhà cung cấp OPENAI/ZHIPU/QWEN
      provider: QWEN
      model: wan2.2-t2i-flash
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/
      timeout: 60
    # AI Vẽ tranh từ hình ảnh
    ai-model-pic-draw:
      # Nhà cung cấp QWEN
      provider: QWEN
      # Hiện chỉ hỗ trợ wan2.5-i2i-preview và wanx2.1-imageedit Mô hình
      model: wan2.5-i2i-preview
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/
      timeout: 60
    # AI Giọng nói hiện chỉ hỗ trợ Zhipu glm-tts
    ai-model-voice:
      provider: ZHIPU
      model: glm-tts
      apiKey: sk-??
      apiHost: https://open.bigmodel.cn/api/paas/v4
      timeout: 60
      # tongtong, chuichui, xiaochen, jam, kazi, douji, luodo
      voice: tongtong
      speed: 1.0
      volume: 0.0
    # AI Video: hỗ trợ Zhipu(ZHIPU) và MiniMax(MINIMAX), chọn một trong hai. Khi chuyển đổi, bật đoạn tương ứng và chú thích đoạn còn lại
    # ===== Zhipu ZHIPU (đang bật)=====
    ai-model-video:
      provider: ZHIPU
      # Các mô hình tùy chọn của Zhipu:cogvideox-3, cogvideox-2, viduq1-text, vidu2-reference
      model: cogvideox-3
      apiKey: sk-??
      apiHost: https://open.bigmodel.cn/api/paas/v4
      timeout: 60
      ffmpeg-path:
      edge-tts-path:
    # ===== MiniMax MINIMAX(Dự phòng, khi bật thì bỏ chú thích bên dưới và chú thích đoạn Zhipu phía trên)=====
    #ai-model-video:
    #  provider: MINIMAX
    #  model: MiniMax-H3
    #  apiKey: Điền apiKey của MiniMax apiKey
    #  apiHost: https://api.minimax.cn
    #  timeout: 60
    # Mô hình vector mặc định
    ai-model-embed:
      provider: QWEN
      model: text-embedding-v1
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/services/
      timeout: 60
  # AIRag Thư viện vector
  ai-rag:
    # AI Nút nhạy cảm trong quy trình(stdio=Nút dòng lệnh, sql=SQL Nút, code=Nút mã/Thực thi script,Nguy cơ cao, tồn tại rủi ro RCE, mặc định tắt)
    allow-sensitive-nodes: sql,code
    embed-store:
      host: 127.0.0.1
      port: 5432
      database: vector_db
      user: postgres
      password: postgres
      table: embeddings
    # Brave Search Tìm kiếm trực tuyến (công cụ AI Agent)
    brave-search:
      api-key: ??
      endpoint: https://api.search.brave.com/res/v1/web/search
      count: 10
      timeout: 15
  #  Unipush Cấu hình địa chỉ URL hóa khi gọi hàm đám mây
  unicloud:
    pushUrl:
  # Cấu hình bảo mật khi nền tảng đưa vào vận hành
  firewall:
    # Bảo mật nguồn dữ liệu (Sau khi bật, nguồn dữ liệu của báo cáo và biểu đồ Online là bắt buộc)
    dataSourceSafe: false
    # Chế độ low-code (dev:Chế độ phát triển,prod:Chế độ phát hành — tắt toàn bộ khả năng phát triển trực tuyến)
    lowCodeMode: dev
    # Có cho phép cùng một tài khoản đăng nhập đồng thời ở nhiều nơi hay không (khi là true thì cho phép đăng nhập cùng lúc, Khi là false thì lần đăng nhập mới sẽ đẩy lần đăng nhập cũ ra)
    is-concurrent: true
    # Đăng nhập có bật mã xác minh hay không
    enableLoginCaptcha: true
    # Có bật kiểm tra mật khẩu mạnh cấp độ bảo vệ 3 hay không (true bật chế độ mật khẩu mạnh, false dùng quy tắc mật khẩu đơn giản)
    enableStrongPwd: false
  # Chuỗi khóa ký(Frontend và backend phải nhất quán, khi phát hành chính thức vui lòng tự sửa)
  signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
  #Giao diện chặn chữ ký
  signUrls: /sys/dict/getDictItems/*,/sys/dict/loadDict/*,/sys/dict/loadDictOrderByValue/*,/sys/dict/loadDictItem/*,/sys/dict/loadTreeData,/sys/api/queryTableDictItemsByCode,/sys/api/queryFilterTableDictInfo,/sys/api/queryTableDictByKeys,/sys/api/translateDictFromTable,/sys/api/translateDictFromTableByKeys,/sys/sendChangePwdSms,/sys/user/sendChangePhoneSms,/sys/sms,/desform/api/sendVerifyCode
  # LibreOffice Thư mục cài đặt, khi không phải đường dẫn cài đặt mặc định thì cấu hình theo đường dẫn thực tế
  libre-office-home:
  # Loại tải lên: local (lưu trữ cục bộ)| minio(Lưu trữ đối tượng MinIO)| alioss(OSS Alibaba Cloud)
  uploadType: local
  # Địa chỉ truy cập frontend
  domainUrl:
    pc: http://localhost:3100
    app: http://localhost:8051
    # Giải quyết Docker / K8s NodePort / Vấn đề cổng vào của reverse proxy không khớp với cổng lắng nghe.
    # Khi chưa cấu hình thì mặc định sử dụng CommonUtils.getBaseUrl(request).
    # back: http://127.0.0.1:8080/jeecg-boot
  path:
    #Đặt thư mục gốc tải tệp lên
    upload: /opt/upFiles
    #webapp Đường dẫn tệp
    webapp: /opt/webapp
  shiro:
    excludeUrls: /test/jeecgDemo/demo3,/test/jeecgDemo/redisDemo/**,/bigscreen/category/**,/bigscreen/visual/**,/bigscreen/map/**,/jmreport/bigscreen2/**
  # Phương thức gửi SMS: aliyun SMS Alibaba Cloud, tencent SMS Tencent Cloud
  smsSendType: aliyun
  #Cấu hình lưu trữ OSS Alibaba Cloud và khóa bí mật SMS Alibaba Dayu
  oss:
    accessKey: ??
    secretKey: ??
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: jeecgdev
    # Mẫu SMS
    sms-template:
      # Chữ ký
      signature:
      # Mẫu code
      templateCode:
        # Mã mẫu SMS đăng nhập, quên mật khẩu
        SMS_175435174:
        # Mã mẫu SMS đổi mật khẩu
        SMS_465391221:
        # Mã mẫu SMS đăng ký tài khoản
        SMS_175430166:
  #Cấu hình khóa bí mật SMS Tencent
  tencent:
    # Tên miền truy cập
    endpoint: sms.tencentcloudapi.com
    secretId: ??
    secretKey: ??
    # Ứng dụng ID
    sdkAppId: ??
    # Thông tin khu vực
    region: ap-beijing
  # Cấu hình địa chỉ máy chủ xem trước tệp trực tuyến
  file-view-domain: http://fileview.jeecg.com
  # minio Tải lên tệp
  minio:
    minio_url: http://minio.jeecg.com
    minio_name: ??
    minio_pass: ??
    bucketName: otatest
  #Đặt tham số báo cáo màn hình lớn
  jmreport:
    #Chế độ đa thuê bao, giá trị mặc định để trống(created:Cách ly theo người tạo,tenant:Cách ly theo thuê bao)
    saasMode: 
    # Chuỗi khóa ký(Frontend và backend phải nhất quán, khi phát hành chính thức vui lòng tự sửa)
    signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
    ai:
      # OpenAI Địa chỉ base tương thích (bắt buộc)
      base-url: https://api.deepseek.com
      # API Key(Bắt buộc, để trống thì AI không dùng được)
      api-key: 
      # Tên mô hình
      model: deepseek-v4-pro
      #Đầu ra xác định, mặc định temperature=0
      temperature: 0
      # Số token tối đa cho một lần sinh(Truyền cho mô hình lớn max_tokens), phạm vi hợp lệ của DeepSeek[1,393216]
      max-tokens: 393216
      # AI Chức năng tự động tạo bảng (cảnh báo bảo mật: Chức năng này sẽ thao tác trực tiếp với cơ sở dữ liệu DDL/DML, môi trường production xin đừng bật)
      autoTableEnabled: true
    # Cấu hình bảo mật khi nền tảng đưa vào vận hành
    firewall:
      # Bảo mật nguồn dữ liệu (Sau khi bật, không được sử dụng nguồn dữ liệu của nền tảng, ký xác thực khi phân tích SQL và không được truy vấn cơ sở dữ liệu)
      dataSourceSafe: false
      # SQL Bảo mật phân tích false: Phân tích bằng cơ sở dữ liệu(Mặc định,Tính ổn định tốt) true: jsqlparser Phân tích cú pháp(Không qua cơ sở dữ liệu,Cấp độ bảo mật cao) v2.2.1+Thêm mới
      sqlParseSafe: true
      # Chế độ phát triển low-code (dev:Chế độ phát triển,prod:Chế độ phát hành — tắt chức năng thiết kế báo cáo trực tuyến, gán vai trò admin, lowdeveloper có thể nới lỏng giới hạn)
      lowCodeMode: dev
      # sql Cấp độ kiểm tra injection (strict:Nghiêm ngặt, basic:Kiểm tra đơn giản, none:Không kiểm tra)
      sqlInjectionLevel: basic
      # Số lần nguồn dữ liệu thử kết nối lại, mặc định 10, để trống hoặc 0 là không giới hạn số lần(2.3.1+)
      numberOfRetries: 10
    # Cấu hình API bản đồ Gaode
    gao-de-api:
      # Ứng dụng key
      api-key: ??
      # Khóa bí mật ứng dụng
      secret-key: ??
  #xxl-job Cấu hình
  xxljob:
    enabled: false
    adminAddresses: http://127.0.0.1:9080/xxl-job-admin
    appname: ${spring.application.name}
    accessToken: ''
    address: 127.0.0.1:30007
    ip: 127.0.0.1
    port: 30007
    logPath: logs/jeecg/job/jobhandler/
    logRetentionDays: 30
  #Cấu hình khóa phân tán
  redisson:
    address: 127.0.0.1:6379
    password:
    type: STANDALONE
    enabled: true
  # Cấu hình API mở Baidu
  baidu-api:
    app-id: ??
    api-key: ??
    secret-key: ??
#cas Đăng nhập một lần
cas:
  prefixUrl: http://cas.example.org:8443/cas
