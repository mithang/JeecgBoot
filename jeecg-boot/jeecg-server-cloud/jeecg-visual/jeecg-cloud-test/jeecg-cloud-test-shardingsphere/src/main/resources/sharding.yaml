# !!!Tên nguồn dữ liệu phải khớp với tên đã cấu hình trong nguồn dữ liệu động
databaseName: sharding-db

# Xem chi tiết trong tài liệu chính thức
dataSources:
  db_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://jeecg-boot-mysql:3306/jeecg-boot?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    password: root
    username: root

rules:
  - !SHARDING
    tables: # Cấu hình quy tắc phân mảnh dữ liệu
      sys_log: # Tên bảng logic
        actualDataNodes: db_0.sys_log$->{0..1} # Do tên nguồn dữ liệu + và tên bảng tạo thành (tham khảo quy tắc cú pháp Inline)
        databaseStrategy: # Chiến lược chia cơ sở dữ liệu, mặc định nghĩa là dùng chiến lược chia cơ sở dữ liệu mặc định, các chiến lược phân mảnh dưới đây chỉ được chọn một
          none:
        tableStrategy: # Chiến lược chia bảng
          standard: # Dùng cho kịch bản phân mảnh chuẩn với một khóa phân mảnh duy nhất
            shardingColumn: log_type # Tên cột phân mảnh
            shardingAlgorithmName: user_inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake
    keyGenerators:
      snowflake:
        type: SNOWFLAKE
        props:
          worker-id: 123
    # Cấu hình thuật toán phân mảnh
    shardingAlgorithms:
      user_inline:
        type: INLINE
        props:
          algorithm-expression: sys_log$->{log_type % 2}

props:
  sql-show: true