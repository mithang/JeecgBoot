server:
  port: 9111
spring:
  boot:
    admin:
      ui:
        title: JeecgCloud Trung tâm giám sát
      client:
        instance:
          metadata:
            tags:
              environment: local
  security:
    user:
      name: "admin"
      password: "admin"
  application:
    name: jeecg-monitor
  cloud:
    nacos:
      discovery:
        server-addr: @config.server-addr@
        namespace: @config.namespace@
        metadata:
          user.name: ${spring.security.user.name}
          user.password: ${spring.security.user.password}
# Kiểm tra endpoint của máy chủ
management:
  httpexchanges:
    recording:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always