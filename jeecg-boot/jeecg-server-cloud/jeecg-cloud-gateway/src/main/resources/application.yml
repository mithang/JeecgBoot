server:
  port: 9999

knife4j:
  gateway:
    enabled: true

spring:
  application:
    name: jeecg-gateway
  main:
    allow-circular-references: true
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      config:
        server-addr: @config.server-addr@
        group: @config.group@
        namespace: @config.namespace@
        username: @config.username@
        password: @config.password@
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: @config.group@
        namespace: @config.namespace@
        username: @config.username@
        password: @config.password@
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          globalcors:
            cors-configurations:
              '[/**]':
                allow-credentials: true
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
    #Sentinel Cấu hình
    sentinel:
      transport:
        dashboard: jeecg-boot-sentinel:9000
      # Hỗ trợ giới hạn lưu lượng theo chuỗi liên kết
      web-context-unify: false
      filter:
        enabled: false
      # Hủy lazy load của console Sentinel
      eager: false
      datasource:
        #Quy tắc kiểm soát luồng
        flow:  # Chỉ định tên nguồn dữ liệu
          # Chỉ định nguồn dữ liệu nacos
          nacos:
            server-addr: @config.server-addr@
            # Chỉ định file cấu hình
            dataId: ${spring.application.name}-flow-rules
            # Chỉ định nhóm
            groupId: SENTINEL_GROUP
            # Chỉ định loại quy tắc của file cấu hình
            rule-type: flow
            # Chỉ định định dạng dữ liệu của file cấu hình
            data-type: json
        #Quy tắc hạ cấp
        degrade:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-degrade-rules
            groupId: SENTINEL_GROUP
            rule-type: degrade
            data-type: json
        #Quy tắc hệ thống
        system:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-system-rules
            groupId: SENTINEL_GROUP
            rule-type: system
            data-type: json
        #Quy tắc ủy quyền
        authority:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-authority-rules
            groupId: SENTINEL_GROUP
            rule-type: authority
            data-type: json
        #Tham số điểm nóng
        param-flow:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-param-rules
            groupId: SENTINEL_GROUP
            rule-type: param-flow
            data-type: json
        #Quy tắc kiểm soát lưu lượng của gateway
        gw-flow:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-flow-rules
            groupId: SENTINEL_GROUP
            rule-type: gw-flow
            data-type: json
        #API Quy tắc kiểm soát luồng
        gw-api-group:
          nacos:
            server-addr: @config.server-addr@
            dataId: ${spring.application.name}-api-rules
            groupId: SENTINEL_GROUP
            rule-type: gw-api-group
            data-type: json